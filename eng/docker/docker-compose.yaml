name: sbus_emulator
services:
  emulator:
    container_name: "emulator"
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - "${CONFIG_PATH}:${DeveloperToolboxConfigPath}"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}" # Password should be same as what is set for SQL Edge  
      ACCEPT_EULA: ${ACCEPT_EULA}
      SQL_WAIT_INTERVAL: ${SQL_WAIT_INTERVAL} # Optional: Time in seconds to wait for SQL to be ready (default is 15 seconds)
    depends_on:
      - sqledge
    networks:
      sb-emulator:
        aliases:
          - "sb-emulator"

  sqledge:
    container_name: "sqledge"
    image: "mcr.microsoft.com/azure-sql-edge:latest"
    networks:
      sb-emulator:
        aliases:
          - "sqledge"
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}" # To be filled by user as per policy : https://learn.microsoft.com/en-us/sql/relational-databases/security/strong-passwords?view=sql-server-linux-ver16 

  azurite:
    container_name: "azurite"
    image: mcr.microsoft.com/azure-storage/azurite:latest
    pull_policy: always
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    volumes:
      - azurite-data:/data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      sb-emulator:
        aliases:
          - "azurite"

  backend:
    container_name: backend
    build:
      context: ../../backend/
      dockerfile: ./eng/docker/dockerfile
    env_file:
      - backend.env
    volumes:
      - "${CONFIG_PATH}:${DeveloperToolboxConfigPath}"
    networks:
      - sb-emulator
    depends_on:
      - emulator
      - azurite

  frontend:
    container_name: frontend
    build:
      context: ../../frontend/
      dockerfile: ./eng/docker/dockerfile
    networks:
      - sb-emulator
    depends_on:
      - backend
    ports:
      - "4300:4300"

  reverse-proxy:
    build:
      context: .
      dockerfile: ./nginx.dockerfile
    container_name: reverse-proxy
    mem_limit: 128m
    cpus: 0.5
    networks:
      - sb-emulator
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:8080"

volumes:
  azurite-data:

networks:
  sb-emulator:
